name: Build Standalone Pure Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node Dependencies
      run: |
        npm install

    - name: Prepare Web Assets for Android
      run: |
        node scripts/prepare-www.js

    - name: Grant Execute Permission for Gradle
      run: |
        chmod +x android/gradlew

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || true
        echo "=== GRADLE LOG START ==="
        tail -n 60 ../gradle.log
        echo "=== GRADLE LOG END ==="
        exit $(cat ../gradle.log | grep -q "BUILD SUCCESSFUL" && echo 0 || echo 1)

    - name: Prepare APK Outputs
      run: |
        mkdir -p dist-apk
        APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
        echo "Found APK at: $APK_PATH"
        cp "$APK_PATH" dist-apk/TaskFlow_Pro.apk
        cp "$APK_PATH" TaskFlow_Pro.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaskFlow_Pro_Android_APK
        path: dist-apk/TaskFlow_Pro.apk
        retention-days: 30

    - name: Commit and Push Updated APK
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add TaskFlow_Pro.apk
        if git diff --staged --quiet; then
          echo "No APK changes to commit"
        else
          git commit -m "Auto-build: Update Pure Native Android TaskFlow_Pro.apk [skip ci]"
          git push
        fi
